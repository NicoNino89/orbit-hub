# SonarCloud (KAN-51). O token fica no segredo SONAR_TOKEN do repositório.
sonar.organization=niconino89
sonar.projectKey=NicoNino89_orbit-hub
sonar.projectName=Orbit Hub
sonar.sourceEncoding=UTF-8

# Escopo: o SonarCloud analisa o repositório inteiro; sonar.sources e sonar.tests não têm mais efeito.
# Os arquivos de teste são marcados aqui e saem sozinhos da conta do código principal.
sonar.test.inclusions=backend/src/test/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**
# tsconfig com comentários não é JSON válido para o analisador; não há nada a analisar neles.
sonar.exclusions=frontend/tsconfig*.json

sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.java.source=21
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# O portão de 80% vale para serviço e domínio (JaCoCo); controllers e configuração ficam fora da conta do Sonar.
sonar.coverage.exclusions=backend/src/main/java/**/config/**,backend/src/main/java/**/OrbitHubApiApplication.java,frontend/src/main.tsx

# Questões revisadas e aceitas em 23/11/2026 (decisões em docs/qualidade/sonar-questoes-aceitas.md).
sonar.issue.ignore.multicriteria=kv,storage,folheador
# Key Vault sem proteção contra expurgo: ambientes de estudo, recriados com terraform destroy.
sonar.issue.ignore.multicriteria.kv.ruleKey=terraform:S8847
sonar.issue.ignore.multicriteria.kv.resourceKey=infra/**/*.tf
# Identidade na Storage Account só serve para chave gerenciada pelo cliente; o acesso é por identidade da API.
sonar.issue.ignore.multicriteria.storage.ruleKey=terraform:S6378
sonar.issue.ignore.multicriteria.storage.resourceKey=infra/modules/ambiente/main.tf
# O livro do catálogo é operado pelo teclado (setas): precisa receber foco (WCAG 2.1.1).
sonar.issue.ignore.multicriteria.folheador.ruleKey=typescript:S6845
sonar.issue.ignore.multicriteria.folheador.resourceKey=frontend/src/catalogo/Folheador.tsx
