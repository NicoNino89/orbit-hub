# Mesmas condições dos alertas do Azure Monitor (infra/), para ver no ambiente local em http://localhost:9090/alerts
groups:
  - name: orbit-hub-api
    rules:
      - alert: ApiForaDoAr
        expr: up{job="orbit-hub-api"} == 0
        for: 1m
        labels:
          gravidade: critica
        annotations:
          resumo: "A API do Orbit Hub não responde há mais de 1 minuto"

      - alert: TaxaDeErrosAlta
        expr: |
          sum(rate(http_server_requests_seconds_count{job="orbit-hub-api",status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_server_requests_seconds_count{job="orbit-hub-api"}[5m])), 1e-9) > 0.05
        for: 5m
        labels:
          gravidade: alta
        annotations:
          resumo: "Mais de 5% das requisições terminaram em erro 5xx nos últimos 5 minutos"

      - alert: RespostaLenta
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{job="orbit-hub-api",uri!~"/actuator.*"}[5m]))) > 1
        for: 10m
        labels:
          gravidade: media
        annotations:
          resumo: "O p95 do tempo de resposta passou de 1 segundo por 10 minutos"

      # Rotinas automáticas (KAN-104)
      - alert: RotinaFalhou
        expr: sum by (rotina) (increase(orbit_rotina_falhas_total{job="orbit-hub-api"}[30m])) > 0
        labels:
          gravidade: alta
        annotations:
          resumo: "A rotina {{ $labels.rotina }} falhou nos últimos 30 minutos"

      - alert: RotinaAtrasada
        expr: max by (rotina) (orbit_rotina_atrasada{job="orbit-hub-api"}) == 1
        for: 15m
        labels:
          gravidade: alta
        annotations:
          resumo: "A rotina {{ $labels.rotina }} não roda no horário esperado"
