# Ambiente local completo do Orbit Hub (KAN-52).
#   cp .env.example .env   (e troque as senhas)
#   docker compose up --build
#
#   Web ........ http://localhost:5173
#   API ........ http://localhost:8080/swagger-ui.html
#   Grafana .... http://localhost:3000
#   Prometheus . http://localhost:9090
#   E-mails .... http://localhost:8025   (Mailpit: caixa de entrada falsa, KAN-12)

name: orbit-hub

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orbithub
      POSTGRES_USER: ${ORBIT_DB_USUARIO:-orbithub}
      POSTGRES_PASSWORD: ${ORBIT_DB_SENHA:?defina ORBIT_DB_SENHA no arquivo .env}
    ports:
      - "127.0.0.1:${ORBIT_DB_PORTA_HOST:-5432}:5432"
    volumes:
      - db-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    image: ghcr.io/niconino89/orbit-hub-api:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      ORBIT_AMBIENTE: local
      ORBIT_DB_URL: jdbc:postgresql://db:5432/orbithub
      ORBIT_DB_USUARIO: ${ORBIT_DB_USUARIO:-orbithub}
      ORBIT_DB_SENHA: ${ORBIT_DB_SENHA}
      ORBIT_ARMAZENAMENTO_TIPO: local
      # vazio no ambiente local: a API gera uma chave aleatória a cada início (as sessões caem ao reiniciar e
      # a equipe precisa configurar o segundo fator de novo, KAN-75); para manter, fixe a chave no .env
      ORBIT_JWT_CHAVE: ${ORBIT_JWT_CHAVE:-}
      # a inatividade da sessão (KAN-15) e os outros prazos são parâmetros: para testar a expiração sem esperar,
      # mude sessao.inatividade_minutos em Backoffice > Parâmetros (KAN-78)
      ORBIT_WEB_URL: http://localhost:5173
      # primeiro administrador (KAN-75, docs/operacao/primeiro-administrador.md); vazio não cria ninguém
      ORBIT_PRIMEIRO_ADMIN_EMAIL: ${ORBIT_PRIMEIRO_ADMIN_EMAIL:-}
      ORBIT_PRIMEIRO_ADMIN_NOME: ${ORBIT_PRIMEIRO_ADMIN_NOME:-Administrador}
      # e-mails vão para o Mailpit (nada sai para a internet)
      ORBIT_EMAIL_TIPO: smtp
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - arquivos:/dados/arquivos

  mailpit:
    image: axllent/mailpit:v1.29
    ports:
      - "127.0.0.1:8025:8025"

  web:
    build: ./frontend
    image: ghcr.io/niconino89/orbit-hub-web:local
    depends_on:
      - api
    ports:
      - "127.0.0.1:5173:8080"

  prometheus:
    image: prom/prometheus:v3.7.3
    volumes:
      - ./observabilidade/prometheus:/etc/prometheus:ro
      - prometheus-dados:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana-oss:12.3.3
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_SENHA:?defina GRAFANA_SENHA no arquivo .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observabilidade/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observabilidade/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-dados:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  db-dados:
  arquivos:
  prometheus-dados:
  grafana-dados:
