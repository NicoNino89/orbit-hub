spring:
  application:
    name: orbit-hub-api
  datasource:
    url: ${ORBIT_DB_URL:jdbc:postgresql://localhost:5432/orbithub}
    username: ${ORBIT_DB_USUARIO:orbithub}
    password: ${ORBIT_DB_SENHA:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      # foto do perfil até 2 MB (KAN-16); folga para o envelope do formulário
      max-file-size: 3MB
      max-request-size: 3MB

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

orbit:
  # local | homologacao | producao
  ambiente: ${ORBIT_AMBIENTE:local}
  # commit publicado, informado pelo pipeline de entrega
  versao: ${ORBIT_VERSAO:}
  cors:
    # origens do front-end que podem chamar a API, separadas por vírgula
    origens: ${ORBIT_CORS_ORIGENS:http://localhost:5173}
  armazenamento:
    tipo: ${ORBIT_ARMAZENAMENTO_TIPO:local}
    local:
      pasta: ${ORBIT_ARMAZENAMENTO_PASTA:./dados/arquivos}
    azure:
      endpoint: ${ORBIT_BLOB_ENDPOINT:}
      container: ${ORBIT_BLOB_CONTAINER:arquivos}
      connection-string: ${ORBIT_BLOB_CONNECTION_STRING:}
  conta:
    # endereço da web, usado nos links enviados por e-mail
    web-url: ${ORBIT_WEB_URL:http://localhost:5173}
    # desligar só enquanto a nuvem não tiver provedor de e-mail (as contas já nascem ativas)
    confirmar-email: ${ORBIT_CONTA_CONFIRMAR_EMAIL:true}
    # cadastro.link_confirmacao_horas (docs/requisitos/processos-e-operacao.md)
    link-confirmacao: PT24H
    link-redefinicao: PT30M
    link-troca-email: PT24H
  email:
    # smtp (servidor de spring.mail: Mailpit no ambiente local) ou registro (só registra no log)
    tipo: ${ORBIT_EMAIL_TIPO:registro}
    remetente: ${ORBIT_EMAIL_REMETENTE:Orbit Hub <nao-responda@orbithub.local>}
  aprovacao:
    # aprovacao.prazo_horas: proposta de ação grave parada além disto alerta o administrador (KAN-81)
    prazo: PT48H
  equipe:
    # convite.validade_dias (docs/requisitos/processos-e-operacao.md): prazo para o membro aceitar o convite
    convite: P14D
    # tempo para digitar o código do segundo fator depois de acertar a senha
    desafio-segundo-fator: PT10M
    # acesso.revisao_meses: a cada quantos meses o administrador revisa os acessos da equipe
    revisao-meses: 3
    # primeiro administrador da implantação (docs/operacao/primeiro-administrador.md); vazio não cria ninguém
    primeiro-administrador:
      email: ${ORBIT_PRIMEIRO_ADMIN_EMAIL:}
      nome: ${ORBIT_PRIMEIRO_ADMIN_NOME:Administrador}
  seguranca:
    jwt:
      # Base64, pelo menos 256 bits. Na nuvem vem do Key Vault; no ambiente local, vazio gera uma chave por início.
      chave: ${ORBIT_JWT_CHAVE:}
      emissor: orbit-hub
      duracao: ${ORBIT_JWT_DURACAO:PT15M}
    sessao:
      # validade do refresh token: sem uso por esse tempo, a sessão expira (KAN-15)
      inatividade: ${ORBIT_SESSAO_INATIVIDADE:PT30M}
      # limite absoluto de uma sessão, mesmo em uso contínuo
      duracao-maxima: ${ORBIT_SESSAO_DURACAO_MAXIMA:PT12H}
      # duas abas renovando ao mesmo tempo não contam como reuso de token
      tolerancia-reuso: PT10S
    login:
      # falhas seguidas que bloqueiam o login e por quanto tempo (KAN-13)
      max-tentativas: ${ORBIT_LOGIN_MAX_TENTATIVAS:5}
      bloqueio: ${ORBIT_LOGIN_BLOQUEIO:PT15M}

logging:
  structured:
    # JSON no padrão ECS: o Application Insights e qualquer agregador leem os campos sem parser próprio.
    # Use ORBIT_LOG_FORMATO=logstash ou gelf para outros destinos.
    format:
      console: ${ORBIT_LOG_FORMATO:ecs}
  level:
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    mail:
      # a saúde da API não depende do provedor de e-mail
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: false
  metrics:
    distribution:
      # histograma para calcular p95 e p99 do tempo de resposta no Grafana
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 200ms,500ms,1s
    tags:
      application: ${spring.application.name}
      ambiente: ${orbit.ambiente}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
