# Infraestrutura como código (KAN-55).
# - Pull request que mexe em infra/: fmt, validate e plan de todas as camadas.
# - Apply e destroy: só manualmente (Actions › Infraestrutura › Run workflow). Disparar é a aprovação.
name: Infraestrutura

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml"]
  workflow_dispatch:
    inputs:
      camada:
        description: Camada
        type: choice
        options: [compartilhado, homologacao, producao]
        required: true
      acao:
        description: Ação
        type: choice
        options: [plan, apply, destroy]
        default: plan
        required: true

permissions:
  contents: read

concurrency:
  group: infra-${{ inputs.camada || github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_regiao: ${{ vars.AZURE_REGIAO }}
  TF_VAR_estado_conta: ${{ vars.TF_ESTADO_CONTA }}
  TF_VAR_email_alertas: ${{ secrets.ALERTAS_EMAIL }}
  TF_VAR_ghcr_token: ${{ secrets.GHCR_LEITURA_TOKEN }}
  TF_VAR_assinatura_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  # Primeiro administrador (KAN-75): segredo opcional; vazio não cria ninguém.
  TF_VAR_primeiro_admin_email: ${{ secrets.PRIMEIRO_ADMIN_EMAIL }}

jobs:
  validar:
    name: fmt e validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
      - name: terraform fmt
        run: terraform fmt -check -recursive infra
      - name: terraform validate
        run: |
          for d in infra/compartilhado infra/envs/homologacao infra/envs/producao; do
            echo "::group::$d"
            terraform -chdir="$d" init -backend=false
            terraform -chdir="$d" validate
            echo "::endgroup::"
          done

  plan-pr:
    name: plan (${{ matrix.camada }})
    if: github.event_name == 'pull_request' && vars.AZURE_CLIENT_ID != ''
    needs: validar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        camada: [compartilhado, homologacao, producao]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Diretório da camada
        id: dir
        run: |
          if [ "${{ matrix.camada }}" = compartilhado ]; then echo "d=infra/compartilhado" >> "$GITHUB_OUTPUT"; else echo "d=infra/envs/${{ matrix.camada }}" >> "$GITHUB_OUTPUT"; fi
      - name: init
        run: terraform -chdir=${{ steps.dir.outputs.d }} init -lock-timeout=5m -backend-config="resource_group_name=rg-orbithub-tfstate" -backend-config="storage_account_name=${{ vars.TF_ESTADO_CONTA }}" -backend-config="container_name=tfstate"
      # Homologação e produção usam o PostgreSQL da camada compartilhado. Antes da primeira aplicação
      # dela, o plano desses ambientes não tem como rodar: o job avisa no resumo e segue, sem falhar o PR.
      - name: Camada compartilhado aplicada?
        id: base
        run: |
          if [ "${{ matrix.camada }}" = compartilhado ] || [ -n "$(az postgres flexible-server list -g rg-orbithub-compartilhado --query '[0].name' -o tsv 2>/dev/null)" ]; then
            echo "pronta=true" >> "$GITHUB_OUTPUT"
          else
            echo "pronta=false" >> "$GITHUB_OUTPUT"
            echo "### Plano: ${{ matrix.camada }}" >> "$GITHUB_STEP_SUMMARY"
            echo "Pulado: a camada compartilhado ainda não foi aplicada. Rode o workflow Infraestrutura (apply, compartilhado) primeiro." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Abrir o PostgreSQL para este runner
        if: matrix.camada != 'compartilhado' && steps.base.outputs.pronta == 'true'
        run: bash infra/bootstrap/firewall-runner.sh abrir
      - name: plan
        if: steps.base.outputs.pronta == 'true'
        run: |
          terraform -chdir=${{ steps.dir.outputs.d }} plan -lock-timeout=5m -no-color -out=plano.tfplan | tee plano.txt
          { echo "### Plano: ${{ matrix.camada }}"; echo '```'; grep -E "^(Plan:|No changes|  # )" plano.txt || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Fechar o PostgreSQL para este runner
        if: always() && matrix.camada != 'compartilhado' && steps.base.outputs.pronta == 'true'
        run: bash infra/bootstrap/firewall-runner.sh fechar

  manual:
    name: ${{ inputs.acao }} (${{ inputs.camada }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: ${{ inputs.camada }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Diretório da camada
        id: dir
        run: |
          if [ "${{ inputs.camada }}" = compartilhado ]; then echo "d=infra/compartilhado" >> "$GITHUB_OUTPUT"; else echo "d=infra/envs/${{ inputs.camada }}" >> "$GITHUB_OUTPUT"; fi
      - name: init
        run: terraform -chdir=${{ steps.dir.outputs.d }} init -lock-timeout=5m -backend-config="resource_group_name=rg-orbithub-tfstate" -backend-config="storage_account_name=${{ vars.TF_ESTADO_CONTA }}" -backend-config="container_name=tfstate"
      - name: Ligar o PostgreSQL, se estiver parado
        if: inputs.camada != 'compartilhado'
        run: bash infra/bootstrap/postgres.sh ligar
      - name: Abrir o PostgreSQL para este runner
        if: inputs.camada != 'compartilhado'
        run: bash infra/bootstrap/firewall-runner.sh abrir
      - name: ${{ inputs.acao }}
        run: |
          d=${{ steps.dir.outputs.d }}
          case "${{ inputs.acao }}" in
            plan)    terraform -chdir=$d plan -lock-timeout=5m ;;
            apply)   terraform -chdir=$d apply -lock-timeout=5m -auto-approve ;;
            destroy) terraform -chdir=$d destroy -lock-timeout=5m -auto-approve ;;
          esac
      - name: Endereços do ambiente
        if: inputs.acao == 'apply' && inputs.camada != 'compartilhado'
        run: |
          {
            echo "### ${{ inputs.camada }}"
            echo "- Web: $(terraform -chdir=${{ steps.dir.outputs.d }} output -raw web_url)"
            echo "- API: $(terraform -chdir=${{ steps.dir.outputs.d }} output -raw api_url)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fechar o PostgreSQL para este runner
        if: always() && inputs.camada != 'compartilhado'
        run: bash infra/bootstrap/firewall-runner.sh fechar
