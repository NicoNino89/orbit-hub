# Integração contínua do Orbit Hub (KAN-51).
# Roda em todo push e pull request. Na main, também publica as imagens no GHCR (KAN-52).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Back-end (build, testes e cobertura)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build, testes de unidade e de integração (Testcontainers) e portão do JaCoCo
        run: ./mvnw -B -ntp verify

      - name: Resultado dos testes no pull request
        if: always()
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        with:
          check_name: Testes do back-end
          report_paths: |
            backend/target/surefire-reports/TEST-*.xml
            backend/target/failsafe-reports/TEST-*.xml
          include_passed: false
          detailed_summary: true

      - name: Cobertura no pull request
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@e51ce1f46f7f8b5331593f935e59cbaf44b84920 # v1.8.0
        with:
          paths: ${{ github.workspace }}/backend/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Cobertura do back-end (JaCoCo)
          update-comment: true
          min-coverage-overall: 80
          min-coverage-changed-files: 80

      - name: Guardar relatórios
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-relatorios
          path: |
            backend/target/site/jacoco/
            backend/target/classes/
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          retention-days: 7

  frontend:
    name: Front-end (lint, tipos, testes e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Lint (oxlint)
        run: npm run lint
      - name: Verificação de tipos
        run: npm run typecheck
      - name: Testes (Vitest) com cobertura
        run: npm run coverage
      - name: Build (Vite)
        run: npm run build
      - name: Dependências sem vulnerabilidade crítica
        run: npm audit --omit=dev --audit-level=critical

      - name: Guardar cobertura
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-cobertura
          path: frontend/coverage/
          retention-days: 7

  observabilidade:
    name: Observabilidade (Prometheus e Grafana)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validar configuração e regras de alerta do Prometheus
        run: |
          docker run --rm -v "$PWD/observabilidade/prometheus:/etc/prometheus:ro" --entrypoint promtool \
            prom/prometheus:v3.7.3 check config /etc/prometheus/prometheus.yml
      - name: Validar o JSON dos painéis do Grafana
        run: for f in observabilidade/grafana/dashboards/*.json; do jq -e ".uid and .panels" "$f" > /dev/null; done

  sonarcloud:
    name: SonarCloud (quality gate)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verificar se o SonarCloud está configurado
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then echo "ativo=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::SONAR_TOKEN não configurado: análise do SonarCloud pulada."; echo "ativo=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.sonar.outputs.ativo == 'true'
        with:
          name: backend-relatorios
          path: backend/target

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.sonar.outputs.ativo == 'true'
        with:
          name: frontend-cobertura
          path: frontend/coverage

      - name: Análise e quality gate
        if: steps.sonar.outputs.ativo == 'true'
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8.5.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.qualitygate.wait=true

  imagens:
    name: Imagens Docker (GHCR)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - nome: orbit-hub-api
            contexto: backend
          - nome: orbit-hub-web
            contexto: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login no GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/niconino89/${{ matrix.nome }}
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=main,enable={{is_default_branch}}

      - name: Build (e publicação na main)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.contexto }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.nome }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nome }}
